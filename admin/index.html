<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面｜Life Shift FUK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ログイン画面 -->
  <main class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <img src="../assets/images/logo.png" alt="Life Shift FUK" class="login-logo">
      <h1>管理画面にログイン</h1>
      <label for="login-password">パスワード</label>
      <div class="password-row">
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button type="button" class="link-button" id="toggle-password">表示する</button>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="button button--primary button--large">ログイン</button>
    </form>
  </main>

  <!-- 管理画面 -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <button type="button" class="menu-button" id="menu-button" aria-controls="sidebar" aria-expanded="false">
        <span aria-hidden="true">☰</span> メニュー
      </button>
      <a href="#home" class="topbar-brand">
        <img src="../assets/images/logo.png" alt="">
        <span>管理画面</span>
      </a>
      <div class="topbar-actions">
        <a href="../index.html" target="_blank" rel="noopener" class="button button--ghost">サイトを見る ↗</a>
        <button type="button" class="button button--ghost" id="logout">ログアウト</button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="管理メニュー"></nav>

    <main class="main" id="main" tabindex="-1"></main>

    <!-- 保存バー -->
    <div class="savebar" id="savebar">
      <p class="savebar-status" id="save-status" aria-live="polite">変更はありません</p>
      <div class="savebar-actions">
        <button type="button" class="button button--ghost" id="discard" disabled>変更を取り消す</button>
        <button type="button" class="button button--primary button--large" id="save" disabled>保存する</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
